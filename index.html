<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SF-Naptar">
<meta name="theme-color" content="#1f6feb">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SF-Naptar</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f5f7fa;color:#1d2433;padding-bottom:env(safe-area-inset-bottom)}
.hidden{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#1f6feb;color:#fff;position:sticky;top:0;z-index:2}
header h1{font-size:17px;margin:0;flex:1}
button{font:inherit;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;background:#e6ebf2;color:#1d2433}
button.primary{background:#1f6feb;color:#fff}
button.danger{background:#d93025;color:#fff}
header button{background:rgba(255,255,255,.2);color:#fff}
main{max-width:900px;margin:0 auto;padding:12px}
.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.monthbar select,.jumprow input{font:inherit;padding:8px;border:1px solid #cfd6e2;border-radius:8px;background:#fff}
.jumprow{display:flex;gap:8px;margin-bottom:10px}
.jumprow input[type=search]{flex:1;min-width:0}
#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:#6b7385;padding:4px}
.day{background:#fff;border-radius:8px;min-height:64px;padding:4px;cursor:pointer;overflow:hidden;border:2px solid transparent}
.day.today .num{background:#1f6feb;color:#fff;border-radius:50%}
.day.sel{border-color:#1f6feb}
.num{display:inline-block;min-width:22px;text-align:center;font-size:13px;font-weight:600;padding:1px 3px}
.chip{font-size:11px;background:#e3edff;color:#1f4fa8;border-radius:4px;padding:2px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:#6b7385}
.t-nappal{background:#fff4c2;color:#7a5a00}
.t-ejszaka{background:#2d3a5c;color:#fff}
.t-pihenes{background:#e5e7eb;color:#374151}
.t-szabadsag{background:#d1f7dc;color:#136f35}
.t-egyeb{background:#e3edff;color:#1f4fa8}
.hol{font-size:10px;color:#c0392b;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.weather{background:#fff;border-radius:10px;padding:10px;margin-bottom:10px}
.wx-bar{display:flex;gap:8px;margin-bottom:8px}
.wx-bar input{flex:1;min-width:0;font:inherit;padding:8px;border:1px solid #cfd6e2;border-radius:8px}
.wx-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wx-day{background:#f5f7fa;border-radius:8px;padding:6px 2px;font-size:11px;line-height:1.4}
.wx-day.sel{outline:2px solid #1f6feb}
.wx-ico{font-size:20px}
.wx-msg{font-size:13px;color:#6b7385;grid-column:1/-1}
.summary{margin-bottom:10px}
.next{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:8px}
.sumrow{display:flex;align-items:center;gap:8px;font-size:13px;color:#64748b}
.hint{font-size:12px;color:#64748b;margin:4px 0 0}
#wxHero{margin-bottom:12px}
.wx-hero{display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#60a5fa,#2563eb);box-shadow:0 10px 28px rgba(37,99,235,.28)}
.wx-hero.bg-warm{background:linear-gradient(135deg,#fdba74,#f59e0b)}
.wx-hero.bg-rain{background:linear-gradient(135deg,#64748b,#334155)}
.wx-hero.bg-snow{background:linear-gradient(135deg,#bfdbfe,#e0f2fe);color:#0f172a}
.wx-hero.bg-fog{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#0f172a}
.wx-hero.bg-storm{background:linear-gradient(135deg,#4c1d95,#1e1b4b)}
.hero-ico{font-size:52px;line-height:1;width:64px;text-align:center;flex:none}
.hero-txt{flex:1;min-width:0}
.hero-day{font-size:13px;opacity:.85;text-transform:capitalize}
.hero-label{font-size:18px;font-weight:700;margin-top:2px}
.hero-temp{text-align:right;flex:none}
.hero-temp .big{font-size:30px;font-weight:800;line-height:1}
.hero-temp .small{font-size:12px;opacity:.9;margin-top:4px}
.ico-sun{animation:pulse 3.5s ease-in-out infinite}
.ico-partly,.ico-cloud,.ico-fog{animation:drift 5s ease-in-out infinite alternate}
.ico-rain{animation:bob 1.6s ease-in-out infinite}
.ico-snow{animation:bob 3s ease-in-out infinite}
.ico-storm{animation:flash 1.4s steps(2,end) infinite}
@keyframes pulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
@keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
@keyframes flash{50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){.hero-ico{animation:none!important}}
#pin{text-align:center}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0 6px;min-height:16px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--primary)}
.dot.on{background:var(--primary)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:270px;margin:12px auto 0}
.key{min-height:64px;border-radius:999px;font-size:24px;font-weight:600;background:var(--bg);color:var(--text);border:1px solid var(--line);box-shadow:none}
.key:active{background:var(--primary);color:#fff}
.day.holiday .num{color:#c0392b}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.quick button{flex:1;min-width:90px}
#dayPanel{background:#fff;border-radius:10px;padding:12px;margin-top:12px}
#dayPanel h2{font-size:16px;margin:0;flex:1;text-transform:capitalize}
.ev{border-left:4px solid #1f6feb;padding:8px 10px;margin:6px 0;background:#f8faff;border-radius:6px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.ev>div{flex:1}
.ev small{color:#6b7385}
form label{display:block;font-size:13px;margin:10px 0 4px;color:#4a5366}
form input,form textarea{width:100%;font:inherit;padding:9px;border:1px solid #cfd6e2;border-radius:8px}
.row{display:flex;gap:8px}
.row>div{flex:1}
dialog{border:0;border-radius:12px;width:min(420px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.35)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.card{max-width:340px;margin:12vh auto;background:#fff;padding:24px;border-radius:12px}
.card h1{font-size:20px;margin-top:0}
.err{color:#d93025;font-size:13px;min-height:18px}
/* ---- Dizájn (felülírja a fenti alapstílusokat) ---- */
:root{--primary:#1d4ed8;--bg:#f1f4f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--radius:16px}
body{background:var(--bg);color:var(--text);font-size:15px;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#1d4ed8,#3b82f6);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 2px 12px rgba(29,78,216,.25)}
header h1{font-size:18px;font-weight:700;letter-spacing:.2px}
header button{background:rgba(255,255,255,.18);border-radius:10px;font-weight:600}
button{border-radius:10px;font-weight:600;min-height:40px;transition:transform .08s,filter .15s}
button:active{transform:scale(.97)}
button:hover{filter:brightness(.97)}
button.primary{background:var(--primary);box-shadow:0 2px 8px rgba(29,78,216,.3)}
main{padding:14px}
.weather,#dayPanel,.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06)}
.weather{padding:12px;margin-bottom:14px}
.wx-bar{gap:8px}
.wx-bar input,.monthbar select,.jumprow input,form input,form textarea{border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);min-height:42px}
.wx-day{border-radius:12px;background:#f8fafc;border:1px solid var(--line);padding:8px 2px}
.wx-day.sel{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(29,78,216,.2)}
.monthbar{gap:8px;margin-bottom:10px}
.monthbar strong{font-size:16px;font-weight:700}
.monthbar button{min-width:40px}
.wd{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 4px}
#grid{gap:6px}
.day{background:var(--card);border-radius:12px;min-height:78px;padding:6px;border:1.5px solid transparent;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.day.sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,78,216,.15)}
.day.today .num{background:var(--primary);color:#fff;border-radius:999px}
.day.holiday{background:#fff5f5}
.num{font-size:13px;font-weight:700;min-width:24px;padding:2px 4px}
.chip{border-radius:6px;font-size:10.5px;font-weight:600;padding:2px 5px;margin-top:3px}
.hol{font-size:9.5px;font-weight:600}
#dayPanel{padding:14px;margin-top:14px}
#dayPanel h2{font-size:16px;font-weight:700}
.quick{gap:8px}
.quick button{flex:1 1 0;min-width:0;min-height:44px;border-radius:999px;font-weight:700}
.ev{border-radius:12px;border-left-width:5px;background:#f8fafc;padding:10px 12px;margin:8px 0}
.ev small{color:var(--muted)}
.t-nappal{background:#fff4c2;color:#7a5a00}
.t-ejszaka{background:#2d3a5c;color:#fff}
.t-pihenes{background:#e5e7eb;color:#374151}
.t-szabadsag{background:#d1f7dc;color:#136f35}
.t-egyeb{background:#e3edff;color:#1f4fa8}
dialog{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(15,23,42,.45);backdrop-filter:blur(3px)}
form label{font-size:13px;font-weight:600;color:var(--muted)}
.card{border-radius:20px;padding:26px;box-shadow:0 10px 40px rgba(15,23,42,.12)}
.card h1{font-size:22px;font-weight:800;color:var(--primary)}
.err{font-size:13px}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b1220;--card:#131c2e;--text:#e2e8f0;--muted:#94a3b8;--line:#243047}
  button{background:#1e293b;color:var(--text)}
  header button{background:rgba(255,255,255,.18);color:#fff}
  .wx-bar input,.monthbar select,.jumprow input,form input,form textarea{background:#0f1828;color:var(--text);border-color:var(--line)}
  .wx-day,.ev{background:#0f1828}
  .day.holiday{background:#2a1820}
  .t-nappal{background:#4a3a0a;color:#fde68a}
  .t-ejszaka{background:#1e2a4a;color:#c7d2fe}
  .t-pihenes{background:#2b3240;color:#d1d5db}
  .t-szabadsag{background:#123d24;color:#86efac}
  .t-egyeb{background:#1e3a8a;color:#bfdbfe}
  .card h1{color:#93c5fd}
}
/* ---- Telefon (600 px alatt) ---- */
@media (max-width:600px){
  main{padding:10px}
  header{padding:calc(10px + env(safe-area-inset-top)) 12px 10px;gap:6px}
  header h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  header button{padding:6px 9px;font-size:13px;min-height:34px}
  input,select,textarea{font-size:16px!important}
  .monthbar{flex-wrap:wrap;gap:6px}
  .monthbar strong{display:none}
  .monthbar select{flex:1;min-width:0}
  .monthbar button{min-height:40px}
  .jumprow{flex-wrap:wrap;gap:6px}
  .jumprow input{flex:1 1 100%}
  .wx-bar{flex-wrap:wrap}
  .wx-bar input{flex:1 1 100%}
  .wx-bar button{width:100%}
  .wx-week{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(74px,1fr);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
  .wx-day{scroll-snap-align:start}
  .wx-ico{font-size:18px}
  .wx-msg{grid-column:auto}
  .wx-hero{padding:12px;gap:10px}
  .hero-ico{font-size:40px;width:48px}
  .hero-label{font-size:16px}
  .hero-temp .big{font-size:24px}
  #grid{gap:3px}
  .wd{font-size:10px;padding:4px 0;letter-spacing:0}
  .day{min-height:50px;padding:3px;border-radius:9px}
  .num{font-size:12px;min-width:20px;padding:0 2px}
  .chip{font-size:0;height:6px;padding:0;margin-top:2px;border-radius:3px}
  .more,.hol{display:none}
  #dayPanel{padding:12px}
  #dayPanel h2{font-size:15px}
  .quick{gap:6px}
  .quick button{font-size:13px;min-height:42px;padding:6px 4px}
  .sumrow{flex-wrap:wrap}
  .sumrow button{width:100%}
  .ev{padding:8px 10px}
  dialog{width:94vw;padding:14px}
  .card{margin:8vh 14px;padding:22px}
}
/* ---- Pinpad: ne nagyítson dupla koppintásra ---- */
body,button,.key{touch-action:manipulation}
.key{-webkit-tap-highlight-color:transparent;user-select:none}

/* ---- iPhone-first finomítás ---- */
html,body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header{background:linear-gradient(135deg,rgba(29,78,216,.96),rgba(59,130,246,.92));-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none}
select{-webkit-appearance:none;appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,#64748b 50%),linear-gradient(135deg,#64748b 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}

/* Párbeszédablakok alulról felnyíló lapként */
dialog{inset:auto 0 0 0;margin:0;width:100%;max-width:100%;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
dialog::backdrop{background:rgba(15,23,42,.4);backdrop-filter:blur(2px)}
#modalTitle{font-size:19px;font-weight:800;margin-bottom:6px}
.actions button{flex:1;min-height:48px;font-size:16px}

@media (max-width:600px){
  main{padding-bottom:110px}
  /* Bejelentkezés és PIN: teljes képernyős, középre igazított */
  #login,#pin{position:fixed;inset:0;margin:0;max-width:none;border-radius:0;border:0;box-shadow:none;display:flex;flex-direction:column;justify-content:center;padding:24px;background:var(--bg)}
  #login>*,#pin>*{width:100%;max-width:340px;margin-left:auto;margin-right:auto}
  #login h1,#pin h1{font-size:26px;text-align:center}
  /* Új esemény: lebegő gomb a jobb alsó sarokban */
  #addBtn{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;border-radius:999px;padding:14px 22px;font-size:16px;box-shadow:0 12px 26px rgba(29,78,216,.45)}
  #dayPanel h2{padding-right:8px}
  form input,form textarea,.monthbar select{min-height:48px}
  .weather,#dayPanel{border-radius:18px}
  .day{border-radius:10px}
  .ev{border-left-width:4px}
}
</style>
</head>
<body>

<section id="login" class="card hidden">
  <h1>SF-Naptar</h1>
  <form id="loginForm">
    <label>E-mail<input type="email" id="email" required autocomplete="username"></label>
    <label>Jelszó<input type="password" id="password" required autocomplete="current-password"></label>
    <div class="err" id="loginErr"></div>
    <button class="primary" style="width:100%;margin-top:10px">Belépés</button>
  </form>
</section>

<section id="pin" class="card hidden">
  <h1 id="pinTitle">PIN-kód</h1>
  <div class="dots" id="dots"></div>
  <div class="err" id="pinErr"></div>
  <div class="keypad" id="keypad"></div>
  <input type="hidden" id="pin1">
  <input type="hidden" id="pin2">
  <button type="button" id="pinLogout" style="width:100%;margin-top:18px">Kijelentkezés</button>
</section>

<div id="app" class="hidden">
  <header>
    <h1>SF-Naptar</h1>
    <button id="lockBtn">Zárolás</button>
    <button id="logout">Kilépés</button>
  </header>
  <main>
    <div id="wxHero"></div>
    <section id="weather" class="weather">
      <div class="wx-bar">
        <input id="city" list="cities" placeholder="Város (pl. Szeged)" aria-label="Város">
        <datalist id="cities">
          <option value="Budapest"><option value="Debrecen"><option value="Szeged"><option value="Miskolc"><option value="Pécs"><option value="Győr"><option value="Nyíregyháza"><option value="Kecskemét"><option value="Székesfehérvár"><option value="Eger"><option value="Szombathely"><option value="Veszprém">
        </datalist>
        <button class="primary" id="cityBtn">Időjárás</button>
      </div>
      <div id="wxWeek" class="wx-week"></div>
    </section>
    <div class="monthbar">
      <button id="prev">‹</button>
      <select id="monthSel" aria-label="Hónap"></select>
      <select id="yearSel" aria-label="Év"></select>
      <button id="next">›</button>
      <button id="todayBtn">Ma</button>
    </div>
    <div class="jumprow">
      <input type="search" id="search" placeholder="Keresés: cím, megjegyzés, dátum (pl. 2026-11)">
      <input type="date" id="jump" title="Ugrás dátumra" aria-label="Ugrás dátumra">
    </div>
    <section class="summary">
      <div id="nextShift" class="next"></div>
      <div class="sumrow">
        <div id="monthSum" style="flex:1"></div>
        <button id="patternBtn">Műszakminta</button>
      </div>
    </section>
    <div id="grid"></div>
    <div id="dayPanel">
      <div style="display:flex;align-items:center;gap:8px">
        <h2 id="dayTitle"></h2>
        <button class="primary" id="addBtn">+ Új</button>
      </div>
      <div class="quick">
        <button data-type="nappal" class="t-nappal">Nappal</button>
        <button data-type="ejszaka" class="t-ejszaka">Éjszaka</button>
        <button data-type="pihenes" class="t-pihenes">Pihenő</button>
        <button data-type="szabadsag" class="t-szabadsag">Szabadság</button>
      </div>
      <button id="copyWeek">Ez a hét másolása a következő hétre</button>
      <div id="dayList"></div>
    </div>
  </main>
</div>

<dialog id="modal">
  <form id="eventForm">
    <h3 id="modalTitle" style="margin:0 0 4px"></h3>
    <label>Megnevezés<input id="f_title" required></label>
    <label>Dátum<input type="date" id="f_date" required></label>
    <div class="row">
      <div><label>Kezdés<input type="time" id="f_start"></label></div>
      <div><label>Vége<input type="time" id="f_end"></label></div>
    </div>
    <label>Megjegyzés<textarea id="f_note" rows="3"></textarea></label>
    <div class="actions">
      <button type="button" id="delBtn" class="danger hidden">Törlés</button>
      <button type="button" id="cancelBtn">Mégse</button>
      <button class="primary">Mentés</button>
    </div>
  </form>
</dialog>

<dialog id="patternModal">
  <form id="patternForm">
    <h3 style="margin:0 0 4px">Műszakminta</h3>
    <p class="hint">Betűk: N = nappal, E = éjszaka, P = pihenő, S = szabadság, - = üres. Például: NNEEPPPP</p>
    <label>Minta<input id="pt_pattern" required placeholder="NNEEPPPP" autocapitalize="characters"></label>
    <label>Kezdő nap<input type="date" id="pt_start" required></label>
    <label>Záró nap<input type="date" id="pt_end" required></label>
    <div class="actions">
      <button type="button" id="ptCancel">Mégse</button>
      <button class="primary">Létrehozás</button>
    </div>
  </form>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBiSyohj4lQwzbYKknm6_T1PAVtf3Z9w3I",
  authDomain: "sf-naptar.firebaseapp.com",
  projectId: "sf-naptar",
  storageBucket: "sf-naptar.firebasestorage.app",
  messagingSenderId: "883896912258",
  appId: "1:883896912258:web:5af63e656c29923ad1a79b"
});

const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

const PIN_KEY = 'sfnaptar_pin_hash';
const PIN_LEN_KEY = 'sfnaptar_pin_len';
const MONTHS = ['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byStart = (a, b) => (a.date + (a.start || '')).localeCompare(b.date + (b.start || ''));

let view = new Date(); view.setDate(1);
let selected = ymd(new Date());
let events = [], unsub = null, editingId = null, editingType = 'egyeb';
let unlocked = false, pinMode = 'setup';

// ---------- Bejelentkezés és PIN ----------
function showScreen(name) {
  $('login').classList.toggle('hidden', name !== 'login');
  $('pin').classList.toggle('hidden', name !== 'pin');
  $('app').classList.toggle('hidden', name !== 'app');
}

auth.onAuthStateChanged(user => {
  if (user) {
    subscribe();
    if (unlocked) showScreen('app'); else showPin();
  } else {
    unlocked = false;
    if (unsub) unsub();
    unsub = null;
    events = [];
    showScreen('login');
  }
});

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginErr').textContent = '';
  try {
    await auth.signInWithEmailAndPassword($('email').value.trim(), $('password').value);
    $('password').value = '';
  } catch (err) {
    $('loginErr').textContent = 'Hibás e-mail vagy jelszó.';
  }
};

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

let pinField = 'pin1';

function showPin() {
  pinMode = localStorage.getItem(PIN_KEY) ? 'unlock' : 'setup';
  pinField = 'pin1';
  $('pinTitle').textContent = pinMode === 'setup' ? 'PIN-kód beállítása' : 'PIN-kód megadása';
  $('pin1').value = ''; $('pin2').value = ''; $('pinErr').textContent = '';
  buildKeypad();
  renderDots();
  showScreen('pin');
}

function unlock() {
  unlocked = true;
  showScreen('app');
  render();
}


async function handlePin() {
  const p1 = $('pin1').value.trim();
  if (!/^\d{4,8}$/.test(p1)) { $('pinErr').textContent = 'A PIN 4–8 számjegyből álljon.'; return; }
  const h = await sha256(p1);
  if (pinMode === 'setup') {
    if ($('pin2').value.trim() !== p1) {
      $('pinErr').textContent = 'A két PIN nem egyezik. Próbáld újra.';
      $('pin2').value = ''; pinField = 'pin2'; renderDots();
      return;
    }
    localStorage.setItem(PIN_KEY, h);
    localStorage.setItem(PIN_LEN_KEY, String(p1.length));
    unlock();
  } else if (h === localStorage.getItem(PIN_KEY)) {
    unlock();
  } else {
    $('pinErr').textContent = 'Hibás PIN-kód.';
    $('pin1').value = '';
    renderDots();
  }
};

// ---------- Pinpad ----------
function buildKeypad() {
  const keys = ['1','2','3','4','5','6','7','8','9','OK','0','⌫'];
  $('keypad').innerHTML = keys.map(k =>
    `<button type="button" class="key" data-k="${k}">${k === 'OK' ? '✓' : k}</button>`).join('');
  $('keypad').querySelectorAll('.key').forEach(b => b.onclick = () => pinKey(b.dataset.k));
}

function renderDots() {
  const len = $(pinField).value.length;
  let h = '';
  for (let i = 0; i < Math.max(4, len); i++) h += `<span class="dot${i < len ? ' on' : ''}"></span>`;
  $('dots').innerHTML = h;
}

function pinKey(k) {
  if (k === 'OK') return pinSubmit();
  const el = $(pinField);
  if (k === '⌫') el.value = el.value.slice(0, -1);
  else if (el.value.length < 8) el.value += k;
  $('pinErr').textContent = '';
  renderDots();
  // Feloldás automatikusan, amint a beírt számjegyek száma eléri a PIN hosszát
  const len = Number(localStorage.getItem(PIN_LEN_KEY));
  if (pinMode === 'unlock' && len && $('pin1').value.length === len) handlePin();
}

function pinSubmit() {
  if (pinMode === 'setup' && pinField === 'pin1') {
    if ($('pin1').value.length < 4) { $('pinErr').textContent = 'Legalább 4 számjegy kell.'; return; }
    pinField = 'pin2';
    $('pinTitle').textContent = 'Erősítsd meg a PIN-kódot';
    $('pinErr').textContent = '';
    renderDots();
    return;
  }
  handlePin();
}
$('pinLogout').onclick = () => auth.signOut();
$('logout').onclick = () => auth.signOut();
$('lockBtn').onclick = () => { unlocked = false; showPin(); };

// ---------- Adatok ----------
function subscribe() {
  if (unsub) unsub();
  unsub = db.collection('events').onSnapshot(snap => {
    events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => alert('Adatbázis hiba: ' + err.message));
}

// ---------- Navigáció: év, hónap, nap ----------
function goTo(y, m, day) {
  const days = new Date(y, m + 1, 0).getDate();
  const d = Math.min(day || Number(selected.split('-')[2]), days);
  view = new Date(y, m, 1);
  selected = ymd(new Date(y, m, d));
  render();
}

$('prev').onclick = () => { const d = new Date(view.getFullYear(), view.getMonth() - 1, 1); goTo(d.getFullYear(), d.getMonth()); };
$('next').onclick = () => { const d = new Date(view.getFullYear(), view.getMonth() + 1, 1); goTo(d.getFullYear(), d.getMonth()); };
$('monthSel').onchange = () => goTo(view.getFullYear(), Number($('monthSel').value));
$('yearSel').onchange = () => goTo(Number($('yearSel').value), view.getMonth());
$('todayBtn').onclick = () => { const t = new Date(); goTo(t.getFullYear(), t.getMonth(), t.getDate()); $('search').value = ''; render(); };
$('jump').onchange = () => {
  const v = $('jump').value;
  if (!v) return;
  const [y, m, d] = v.split('-').map(Number);
  $('search').value = '';
  goTo(y, m - 1, d);
  $('jump').value = '';
};

function syncSelects() {
  const y = view.getFullYear(), cy = new Date().getFullYear();
  const lo = Math.min(cy - 5, y), hi = Math.max(cy + 10, y);
  let ys = '';
  for (let i = lo; i <= hi; i++) ys += `<option value="${i}">${i}</option>`;
  $('yearSel').innerHTML = ys;
  $('yearSel').value = y;
  $('monthSel').innerHTML = MONTHS.map((n, i) => `<option value="${i}">${n}</option>`).join('');
  $('monthSel').value = view.getMonth();
}

// ---------- Kirajzolás ----------
function render() {
  if (!unlocked) return;
  syncSelects();
  const grid = $('grid');
  grid.innerHTML = '';
  ['H','K','Sze','Cs','P','Szo','V'].forEach(w => grid.insertAdjacentHTML('beforeend', `<div class="wd">${w}</div>`));
  const offset = (view.getDay() + 6) % 7;
  for (let i = 0; i < offset; i++) grid.insertAdjacentHTML('beforeend', '<div></div>');
  const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  const today = ymd(new Date());
  const HOL = holidays(view.getFullYear());
  for (let d = 1; d <= days; d++) {
    const key = ymd(new Date(view.getFullYear(), view.getMonth(), d));
    const list = events.filter(e => e.date === key).sort(byStart);
    const cell = document.createElement('div');
    cell.className = 'day' + (key === today ? ' today' : '') + (key === selected ? ' sel' : '') + (HOL[key] ? ' holiday' : '');
    cell.innerHTML = `<span class="num">${d}</span>${HOL[key] ? `<div class="hol">${esc(HOL[key])}</div>` : ''}` +
      list.slice(0, 3).map(e => `<div class="chip t-${e.type || 'egyeb'}">${esc(e.start)} ${esc(e.title)}</div>`).join('') +
      (list.length > 3 ? `<div class="more">+${list.length - 3} további</div>` : '');
    cell.onclick = () => { selected = key; render(); };
    grid.appendChild(cell);
  }
  renderDay();
  renderWeek();
  renderSummary();
  renderNext();
}

function normalizeQuery(raw) {
  return raw.trim().toLowerCase().replace(/\./g, '-').replace(/[-\s]+$/, '');
}

function renderDay() {
  const box = $('dayList');
  box.innerHTML = '';
  const q = normalizeQuery($('search').value);

  if (q) {
    const hits = events.filter(e =>
      [e.title, e.note, e.date, e.start, e.end, e.by].some(v => String(v || '').toLowerCase().includes(q))
    ).sort(byStart);
    $('dayTitle').textContent = `Találatok: ${hits.length}`;
    if (!hits.length) box.innerHTML = '<p style="color:#6b7385">Nincs találat.</p>';
    hits.forEach(e => {
      const el = document.createElement('div');
      el.className = 'ev';
      el.innerHTML = `<div><strong>${esc(e.title)}</strong><br>` +
        `<small>${esc(e.date)} ${esc(e.start)}${e.end ? '–' + esc(e.end) : ''}</small>` +
        (e.note ? `<div>${esc(e.note)}</div>` : '') + `</div>`;
      el.onclick = () => {
        $('search').value = '';
        const [y, m, d] = e.date.split('-').map(Number);
        goTo(y, m - 1, d);
      };
      box.appendChild(el);
    });
    return;
  }

  const [y, m, d] = selected.split('-').map(Number);
  const hName = holidays(y)[selected];
  $('dayTitle').textContent = new Date(y, m - 1, d).toLocaleDateString('hu-HU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + (hName ? ` – ${hName}` : '');
  const list = events.filter(e => e.date === selected).sort(byStart);
  box.innerHTML = list.length ? '' : '<p style="color:#6b7385">Nincs esemény ezen a napon.</p>';
  list.forEach(e => {
    const el = document.createElement('div');
    el.className = 'ev';
    el.innerHTML = `<div><strong>${esc(e.title)}</strong><br>` +
      `<small>${esc(e.start)}${e.end ? '–' + esc(e.end) : ''} · utoljára: ${esc(e.by)}</small>` +
      (e.note ? `<div>${esc(e.note)}</div>` : '') + `</div><button>Szerk.</button>`;
    el.querySelector('button').onclick = () => openModal(e);
    box.appendChild(el);
  });
}

$('search').oninput = () => renderDay();

// ---------- Összesítő és következő műszak ----------
function renderSummary() {
  const prefix = ymd(view).slice(0, 7);
  const cnt = { nappal: 0, ejszaka: 0, pihenes: 0, szabadsag: 0 };
  events.forEach(e => { if (e.date && e.date.startsWith(prefix) && cnt[e.type] !== undefined) cnt[e.type]++; });
  $('monthSum').innerHTML = `Nappal: <b>${cnt.nappal}</b> · Éjszaka: <b>${cnt.ejszaka}</b> · Pihenő: <b>${cnt.pihenes}</b> · Szabadság: <b>${cnt.szabadsag}</b>`;
}

function renderNext() {
  const today = ymd(new Date());
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  const next = events
    .filter(e => (e.type === 'nappal' || e.type === 'ejszaka') && e.date >= today)
    .sort(byStart)[0];
  if (!next) { $('nextShift').textContent = 'Nincs következő műszak a naptárban.'; return; }
  const [y, m, d] = next.date.split('-').map(Number);
  const when = next.date === today ? 'ma'
    : next.date === ymd(tomorrow) ? 'holnap'
    : new Date(y, m - 1, d).toLocaleDateString('hu-HU', { weekday: 'long', month: 'long', day: 'numeric' });
  $('nextShift').innerHTML = `Következő műszak: <b>${when}</b> – ${TYPE_LABELS[next.type]}`;
}

// ---------- Műszakminta ----------
const TYPE_BY_LETTER = { N: 'nappal', E: 'ejszaka', P: 'pihenes', S: 'szabadsag' };
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

$('patternBtn').onclick = () => {
  const last = new Date(view.getFullYear(), view.getMonth() + 1, 0);
  $('pt_start').value = selected;
  $('pt_end').value = ymd(last);
  $('patternModal').showModal();
};
$('ptCancel').onclick = () => $('patternModal').close();

$('patternForm').onsubmit = async e => {
  e.preventDefault();
  const pat = $('pt_pattern').value.toUpperCase().replace(/[^NEPS-]/g, '');
  if (!pat) { alert('Adj meg legalább egy betűt: N, E, P, S vagy -'); return; }
  const start = parseDay($('pt_start').value), end = parseDay($('pt_end').value);
  const days = Math.round((end - start) / 86400000) + 1;
  if (days < 1) { alert('A záró nap legyen a kezdő nap után.'); return; }
  if (days > 366) { alert('Egyszerre legfeljebb 366 napot lehet kitölteni.'); return; }
  const existing = new Set(events.map(ev => `${ev.date}|${ev.type}`));
  const batch = db.batch();
  let count = 0;
  for (let i = 0; i < days; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const type = TYPE_BY_LETTER[pat[i % pat.length]];
    const key = ymd(d);
    if (!type || existing.has(`${key}|${type}`)) continue;
    batch.set(db.collection('events').doc(), {
      title: TYPE_LABELS[type], date: key, start: '', end: '', note: '', type,
      by: auth.currentUser.email, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    count++;
  }
  if (!count) { alert('Nincs új bejegyzés: a minta vagy már kitöltötte ezeket a napokat.'); return; }
  try {
    await batch.commit();
    $('patternModal').close();
  } catch (err) {
    alert('Mentés sikertelen: ' + err.message);
  }
};

// ---------- Heti másolás a következő hétre ----------
$('copyWeek').onclick = async () => {
  const sel = parseDay(selected);
  const monday = new Date(sel.getFullYear(), sel.getMonth(), sel.getDate() - ((sel.getDay() + 6) % 7));
  const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
  const weekEvents = events.filter(e => e.date >= ymd(monday) && e.date <= ymd(sunday));
  if (!weekEvents.length) { alert('Ebben a hétben nincs bejegyzés.'); return; }
  const existing = new Set(events.map(e => `${e.date}|${e.type}|${e.title}`));
  const batch = db.batch();
  let count = 0;
  weekEvents.forEach(e => {
    const d = parseDay(e.date);
    const nd = ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7));
    if (existing.has(`${nd}|${e.type}|${e.title}`)) return;
    batch.set(db.collection('events').doc(), {
      title: e.title, date: nd, start: e.start || '', end: e.end || '', note: e.note || '',
      type: e.type || 'egyeb', by: auth.currentUser.email,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    count++;
  });
  if (!count) { alert('A következő hétre már minden bejegyzés megvan.'); return; }
  if (!confirm(`${count} bejegyzés másolása a következő hétre?`)) return;
  try {
    await batch.commit();
    const nx = new Date(sel.getFullYear(), sel.getMonth(), sel.getDate() + 7);
    goTo(nx.getFullYear(), nx.getMonth(), nx.getDate());
  } catch (err) {
    alert('Másolás sikertelen: ' + err.message);
  }
};

// ---------- Időjárás (Open-Meteo, kulcs nélkül) ----------
const WX_CITY_KEY = 'sfnaptar_city';
let wxDaily = null; // { 'YYYY-MM-DD': { code, max, min, pp } }
const WMO = {
  0: ['☀️', 'Derült'], 1: ['🌤️', 'Többnyire derült'], 2: ['⛅', 'Részben felhős'], 3: ['☁️', 'Borult'],
  45: ['🌫️', 'Köd'], 48: ['🌫️', 'Zúzmarás köd'],
  51: ['🌦️', 'Szitálás'], 53: ['🌦️', 'Szitálás'], 55: ['🌦️', 'Szitálás'],
  56: ['🌧️', 'Ónos szitálás'], 57: ['🌧️', 'Ónos szitálás'],
  61: ['🌧️', 'Eső'], 63: ['🌧️', 'Eső'], 65: ['🌧️', 'Erős eső'], 66: ['🌧️', 'Ónos eső'], 67: ['🌧️', 'Ónos eső'],
  71: ['🌨️', 'Havazás'], 73: ['🌨️', 'Havazás'], 75: ['❄️', 'Erős havazás'], 77: ['🌨️', 'Hódara'],
  80: ['🌦️', 'Zápor'], 81: ['🌦️', 'Zápor'], 82: ['⛈️', 'Heves zápor'],
  85: ['🌨️', 'Hózápor'], 86: ['🌨️', 'Hózápor'],
  95: ['⛈️', 'Zivatar'], 96: ['⛈️', 'Zivatar jéggel'], 99: ['⛈️', 'Zivatar jéggel']
};
const wmo = c => WMO[c] || ['🌡️', 'Ismeretlen'];

const cityLabel = r => [r.name, r.admin1, r.country].filter(Boolean).join(', ');
let citySuggest = {};
let suggestTimer = null;

async function loadWeather(arg) {
  $('wxWeek').innerHTML = '<div class="wx-msg">Betöltés…</div>';
  try {
    let r = typeof arg === 'object' ? arg : null;
    if (!r) {
      const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(arg)}&count=1&language=hu&format=json`)).json();
      r = g.results && g.results[0];
      if (!r) { $('wxWeek').innerHTML = '<div class="wx-msg">Nem található ilyen város.</div>'; return; }
    }
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${r.latitude}&longitude=${r.longitude}` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
      `&timezone=Europe%2FBudapest&past_days=14&forecast_days=16`;
    const f = await (await fetch(url)).json();
    wxDaily = {};
    f.daily.time.forEach((t, i) => {
      wxDaily[t] = {
        code: f.daily.weather_code[i],
        max: f.daily.temperature_2m_max[i],
        min: f.daily.temperature_2m_min[i],
        pp: f.daily.precipitation_probability_max[i]
      };
    });
    $('city').value = cityLabel(r);
    localStorage.setItem(WX_CITY_KEY, JSON.stringify(r));
    renderWeek();
  } catch (err) {
    $('wxWeek').innerHTML = '<div class="wx-msg">Az időjárás most nem tölthető be.</div>';
  }
}

const WX_BG = { sun: 'warm', partly: '', cloud: '', fog: 'fog', rain: 'rain', snow: 'snow', storm: 'storm' };
const wxCat = c =>
  c <= 1 ? 'sun' : c === 2 ? 'partly' : c === 3 ? 'cloud' : (c === 45 || c === 48) ? 'fog' :
  (c >= 51 && c <= 67) || (c >= 80 && c <= 82) ? 'rain' :
  (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'snow' : c >= 95 ? 'storm' : 'cloud';

// Kiválasztott nap időjárása a felső sávban, animált ikonnal
function renderHero() {
  const box = $('wxHero');
  const dayName = parseDay(selected).toLocaleDateString('hu-HU', { weekday: 'long', month: 'long', day: 'numeric' });
  const w = wxDaily && wxDaily[selected];
  if (!w) {
    const msg = wxDaily ? 'Erre a napra nincs előrejelzés' : 'Válassz várost az időjárás megjelenítéséhez';
    box.innerHTML = `<div class="wx-hero"><div class="hero-txt"><div class="hero-day">${esc(dayName)}</div><div class="hero-label" style="font-size:15px">${msg}</div></div></div>`;
    return;
  }
  const cat = wxCat(w.code);
  const [ico, label] = wmo(w.code);
  box.innerHTML = `<div class="wx-hero bg-${WX_BG[cat]}">` +
    `<div class="hero-ico ico-${cat}">${ico}</div>` +
    `<div class="hero-txt"><div class="hero-day">${esc(dayName)}</div><div class="hero-label">${esc(label)}</div></div>` +
    `<div class="hero-temp"><div class="big">${Math.round(w.max)}°</div>` +
    `<div class="small">min ${Math.round(w.min)}° · ☔ ${w.pp ?? '–'}%</div></div></div>`;
}

function renderWeek() {
  renderHero();
  const box = $('wxWeek');
  if (!wxDaily) { box.innerHTML = '<div class="wx-msg">Válassz várost a fenti mezőben.</div>'; return; }
  const [y, m, d] = selected.split('-').map(Number);
  const sel = new Date(y, m - 1, d);
  const monday = new Date(y, m - 1, d - ((sel.getDay() + 6) % 7));
  let html = '', any = false;
  for (let i = 0; i < 7; i++) {
    const day = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
    const key = ymd(day);
    const w = wxDaily[key];
    const [ico, label] = w ? wmo(w.code) : ['–', 'nincs adat'];
    if (w) any = true;
    html += `<div class="wx-day${key === selected ? ' sel' : ''}" title="${esc(label)}">` +
      `<div>${day.toLocaleDateString('hu-HU', { weekday: 'short' })}</div><div>${day.getDate()}.</div>` +
      `<div class="wx-ico">${ico}</div>` +
      (w ? `<div>${esc(label)}</div><div>${Math.round(w.max)}° / ${Math.round(w.min)}°</div><div>☔ ${w.pp ?? '–'}%</div>` : '<div>–</div>') +
      `</div>`;
  }
  box.innerHTML = html + (any ? '' : '<div class="wx-msg">Erre a hétre nincs előrejelzés.</div>');
}

// Gépelés közben a világ bármely városát javasolja (Open-Meteo geokódolás)
$('city').oninput = () => {
  clearTimeout(suggestTimer);
  const q = $('city').value.trim();
  if (q.length < 2) return;
  suggestTimer = setTimeout(async () => {
    try {
      const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=hu&format=json`)).json();
      citySuggest = {};
      $('cities').innerHTML = (g.results || []).map(r => {
        const label = cityLabel(r);
        citySuggest[label] = r;
        return `<option value="${esc(label)}">`;
      }).join('');
    } catch (err) { /* csendes hiba: nincs javaslat */ }
  }, 300);
};

$('cityBtn').onclick = () => {
  const v = $('city').value.trim();
  if (!v) return;
  loadWeather(citySuggest[v] || v);
};
$('city').onkeydown = e => { if (e.key === 'Enter') $('cityBtn').click(); };

const savedCity = localStorage.getItem(WX_CITY_KEY);

// ---------- Gyors bejegyzések (műszak, pihenő, szabadság) ----------
const TYPE_LABELS = { nappal: 'Nappal', ejszaka: 'Éjszaka', pihenes: 'Pihenő', szabadsag: 'Szabadság' };

// ---------- Magyar munkaszüneti napok (évente számolva) ----------
const HOLIDAYS_FIXED = {
  '01-01': 'Újév', '03-15': 'Nemzeti ünnep', '05-01': 'A munka ünnepe',
  '08-20': 'Államalapítás ünnepe', '10-23': 'Nemzeti ünnep', '11-01': 'Mindenszentek',
  '12-25': 'Karácsony', '12-26': 'Karácsony másnapja'
};

// Húsvétvasárnap (Anonymous Gregorian algoritmus)
function easterSunday(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}

function holidays(y) {
  const map = {};
  for (const k in HOLIDAYS_FIXED) map[`${y}-${k}`] = HOLIDAYS_FIXED[k];
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const e = easterSunday(y);
  map[ymd(addDays(e, -2))] = 'Nagypéntek';
  map[ymd(e)] = 'Húsvétvasárnap';
  map[ymd(addDays(e, 1))] = 'Húsvéthétfő';
  map[ymd(addDays(e, 49))] = 'Pünkösdvasárnap';
  map[ymd(addDays(e, 50))] = 'Pünkösdhétfő';
  return map;
}

async function quickAdd(type) {
  const data = {
    title: TYPE_LABELS[type],
    date: selected,
    start: '',
    end: '',
    note: '',
    type,
    by: auth.currentUser.email,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    await db.collection('events').add(data);
  } catch (err) {
    alert('Mentés sikertelen: ' + err.message);
  }
}

document.querySelectorAll('[data-type]').forEach(b => b.onclick = () => quickAdd(b.dataset.type));

// ---------- Esemény űrlap ----------
function openModal(ev) {
  editingId = ev ? ev.id : null;
  editingType = ev?.type || 'egyeb';
  $('modalTitle').textContent = ev ? 'Esemény szerkesztése' : 'Új esemény';
  $('f_title').value = ev?.title || '';
  $('f_date').value = ev?.date || selected;
  $('f_start').value = ev?.start || '';
  $('f_end').value = ev?.end || '';
  $('f_note').value = ev?.note || '';
  $('delBtn').classList.toggle('hidden', !ev);
  $('modal').showModal();
}
$('addBtn').onclick = () => openModal(null);
$('cancelBtn').onclick = () => $('modal').close();

$('eventForm').onsubmit = async e => {
  e.preventDefault();
  const data = {
    title: $('f_title').value.trim(),
    date: $('f_date').value,
    start: $('f_start').value,
    end: $('f_end').value,
    note: $('f_note').value.trim(),
    type: editingType,
    by: auth.currentUser.email,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    if (editingId) await db.collection('events').doc(editingId).update(data);
    else await db.collection('events').add(data);
    $('modal').close();
    const [y, m, d] = data.date.split('-').map(Number);
    goTo(y, m - 1, d);
  } catch (err) {
    alert('Mentés sikertelen: ' + err.message);
  }
};

$('delBtn').onclick = async () => {
  if (!editingId || !confirm('Biztosan törlöd ezt az eseményt?')) return;
  try {
    await db.collection('events').doc(editingId).delete();
    $('modal').close();
  } catch (err) {
    alert('Törlés sikertelen: ' + err.message);
  }
};
</script>
